<title>思源学校管理系统</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Layout: one working column; top bar with tabs, main panel; student detail opens in a sheet. */
:root {
  --bg: #f5f7f6; --surface: #ffffff; --sunken: #eaefed; --line: #d5dedb;
  --fg: #17211e; --muted: #5d6b67; --accent: #0c7a54; --accent-fg: #ffffff; --accent-soft: #ddf3ea; --brand: #18a873;
  --seal: #b4372b; --seal-soft: #f8e1dd; --amber: #9a6200; --amber-soft: #fbecd0;
  --blue: #2c5f9e; --blue-soft: #dfe9f7; --grey-soft: #e6e9e8;
  --f-display: "Noto Serif SC", "Songti SC", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111816; --surface: #18211e; --sunken: #0d1311; --line: #2b3834;
  --fg: #e4ece9; --muted: #95a6a0; --accent: #26b07e; --accent-fg: #06130f; --accent-soft: #0f3527; --brand: #26b07e;
  --seal: #ef7a6c; --seal-soft: #3d1c18; --amber: #e7b55a; --amber-soft: #3a2b10;
  --blue: #7fb0ec; --blue-soft: #18283d; --grey-soft: #252e2b; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111816; --surface: #18211e; --sunken: #0d1311; --line: #2b3834;
  --fg: #e4ece9; --muted: #95a6a0; --accent: #26b07e; --accent-fg: #06130f; --accent-soft: #0f3527; --brand: #26b07e;
  --seal: #ef7a6c; --seal-soft: #3d1c18; --amber: #e7b55a; --amber-soft: #3a2b10;
  --blue: #7fb0ec; --blue-soft: #18283d; --grey-soft: #252e2b; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.55 }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
.wrap.wide { max-width: 1720px }
.wrap.widemain main { width: min(1720px, calc(100vw - 32px)); margin-left: calc((100% - min(1720px, calc(100vw - 32px))) / 2) }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 18px 12px; border-bottom: 1px solid var(--line) }
.brand { display: flex; align-items: center; gap: 10px }
/* The header mark is the school's round seal (logo green #18a873), drawn on white so it reads in both themes. */
.seal { width: 40px; height: 40px; border-radius: 50%; background: #fff; flex: none; display: block }
.brand h1 { font-family: var(--f-display); font-size: 19px; margin: 0; letter-spacing: .04em }
.brand small { display: block; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto }
nav.tabs button { border: 0; background: none; color: var(--muted); font: inherit; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-weight: 500 }
nav.tabs button[aria-current="true"] { background: var(--accent-soft); color: var(--accent) }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-left: 6px }
nav.tabs .lang button { border-radius: 0; padding: 6px 10px; font-size: 12.5px }
nav.tabs .lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg) }
nav.tabs .subtabs { order: 99; flex-basis: 100%; display: flex; gap: 4px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 6px; margin-top: 2px }
nav.tabs .subtabs button { font-size: 13.5px; padding: 5px 10px }
nav.tabs .count { background: var(--seal); color: #fff; border-radius: 9px; font-size: 11px; padding: 0 6px; margin-left: 4px }
nav.tabs .acctbtn { margin-left: 6px; border: 1px solid var(--line); color: var(--fg); padding: 5px 10px; font-size: 12.5px; max-width: 14em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
nav.tabs .acctbtn::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--brand); margin-right: 6px; vertical-align: 1px }
/* Sign-in: one centred card; nothing else of the app shows until an account is signed in. */
.login { width: min(400px, 100%); margin: 32px auto 0 }
.login .seal { width: 72px; height: 72px; justify-self: center }
.login h2 { text-align: center }
.login .btn.primary { padding: 9px 12px }
.login-err { margin: 0; color: var(--seal); font-size: 13px }
.login-err:empty { display: none }
/* Reading a paper enrollment form: the box at the top of the student form, and what it filled in (green) or could not read well (amber). */
.scanbox { display: grid; gap: 6px; padding: 10px 12px; border: 1px dashed var(--brand); border-radius: var(--r); background: color-mix(in srgb, var(--accent-soft) 55%, transparent); font-size: 13px }
.scanbox .row { gap: 6px 10px }
input.auto, select.auto, textarea.auto { background: var(--accent-soft); border-color: var(--accent) }
input.unsure, select.unsure, textarea.unsure { background: var(--amber-soft); border-color: var(--amber) }
.ochint { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; color: var(--amber); font-size: 12px }
.ochint b { color: var(--fg); font-weight: 500 }
main { padding-top: 20px; display: grid; gap: 20px }
h2 { font-family: var(--f-display); font-size: 18px; margin: 0; text-wrap: balance }
h3 { font-size: 13px; margin: 0; color: var(--muted); letter-spacing: .06em; font-weight: 700 }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px }
.spacer { flex: 1 }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px }
.tile b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; font-weight: 700 }
.tile span { color: var(--muted); font-size: 12px }
.btn { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 500 }
.btn.danger { color: var(--seal); border-color: var(--seal) }
.btn.small { padding: 3px 9px; font-size: 12.5px }
.btn:disabled { opacity: .5; cursor: default }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
input, select, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; width: 100%; min-width: 0 }
textarea { min-height: 64px; resize: vertical }
label.f { display: grid; gap: 3px; font-size: 12.5px; color: var(--muted); min-width: 0; align-content: start }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 14px }
.tablewrap { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top }
tr.click { cursor: pointer }
.whocell { display: flex; align-items: center; gap: 10px }
.av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: none; display: inline-grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .02em }
.av.big { width: 56px; height: 56px; font-size: 18px }
.avup { cursor: pointer; position: relative; display: inline-flex }
.avup:hover .av { outline: 2px solid var(--accent); outline-offset: 2px }
td.nm { white-space: nowrap }
tr.click:hover td { background: var(--sunken) }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; white-space: nowrap; font-weight: 500 }
.st-上课中 { background: var(--accent-soft); color: var(--accent) }
.st-待排课 { background: var(--amber-soft); color: var(--amber) }
.st-试听 { background: var(--blue-soft); color: var(--blue) }
.st-暂停 { background: var(--grey-soft); color: var(--muted) }
.st-不上课了 { background: var(--grey-soft); color: var(--muted); text-decoration: line-through }
.pill.owe { background: var(--seal); color: #fff; margin-left: 4px }
tr.owerow td { background: var(--seal-soft) }
tr.owerow td:first-child { box-shadow: inset 4px 0 0 var(--seal) }
.btn.owebtn { border-color: var(--seal); color: var(--seal); font-weight: 600 }
.btn.owebtn[aria-pressed="true"] { background: var(--seal); color: #fff }
button.tile { font: inherit; color: inherit; text-align: left; cursor: pointer }
.tile.owetile { border-color: var(--seal); background: var(--seal-soft) }
.tile.owetile b { color: var(--seal) }
.famchip { font: inherit; font-size: 11.5px; border: 1px solid var(--line); background: var(--sunken); color: var(--fg); border-radius: 999px; padding: 1px 8px; margin-left: 4px; cursor: pointer; white-space: nowrap }
.famchip:hover { border-color: var(--accent) }
.famcard { display: grid; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface) }
.famcard.owe { border-left: 4px solid var(--seal) }
.famline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--sunken); border-radius: 6px; padding: 8px 12px }
.lfilt { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px }
.lfilt button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 4px 12px; cursor: pointer }
.lfilt button span { color: var(--muted); font-size: 12px; margin-left: 2px }
.lfilt button.on { background: var(--accent); border-color: var(--accent); color: #fff } .lfilt button.on span { color: #fff; opacity: .85 }
.llist { display: grid; border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.lcard { display: grid; grid-template-columns: minmax(230px, 1.25fr) minmax(170px, 1.2fr) minmax(150px, .9fr) auto; gap: 8px 16px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--surface) }
.lcard:first-child { border-top: 0 } .lcard:hover { background: var(--sunken) }
.lcard.late { box-shadow: inset 4px 0 0 var(--seal) }
.lwho { display: flex; align-items: center; gap: 10px; min-width: 0 } .lwho > div { min-width: 0 }
.lname { font-weight: 600; overflow-wrap: anywhere }
.lsub { display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--muted); font-size: 12.5px; margin-top: 2px; align-items: center }
.lmail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 210px }
.lwant, .lstat { min-width: 0; font-size: 13.5px }
.lact { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap }
@media (max-width: 900px) { .lcard { grid-template-columns: 1fr auto } .lwant { grid-column: 1 } .lstat { grid-column: 2; grid-row: 1; text-align: right } .lstat .lsub { justify-content: flex-end } .lact { grid-column: 1 / -1; justify-content: flex-start } }
@media (max-width: 520px) { .lcard { grid-template-columns: 1fr } .lstat { grid-column: 1; grid-row: auto; text-align: left } .lstat .lsub { justify-content: flex-start } }
dl.kv dd { white-space: pre-line }
.bakbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; border: 1px solid var(--line); border-left: 4px solid var(--blue); background: var(--surface); border-radius: 6px; padding: 10px 12px }
.ztl { display: grid; min-width: max-content; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
.zhead { position: sticky; top: 0; z-index: 2; background: var(--sunken); padding: 6px 8px; font-weight: 600; font-size: 13px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.zhead span { display: block; font-weight: 400; font-size: 11px; color: var(--muted) }
.zcol { position: relative; border-left: 1px solid var(--line) }
.ztime { border-left: 0 }
.ztime span { position: absolute; right: 6px; font-size: 11px; color: var(--muted); transform: translateY(-1px) }
.zhr { position: absolute; left: 0; right: 0; border: 0; border-top: 1px dashed var(--line); background: transparent; cursor: pointer; padding: 0; border-radius: 0 }
.zhr:hover { background: var(--accent-soft) }
.zhr:hover::after { content: "＋"; color: var(--accent); font-size: 16px }
.zblk, .zchip { --tc: var(--muted); border: 1px solid color-mix(in srgb, var(--tc) 55%, transparent); border-left: 4px solid var(--tc); background: color-mix(in srgb, var(--tc) 16%, var(--surface)); color: var(--fg); border-radius: 6px; text-align: left; cursor: pointer; font-size: 12.5px; line-height: 1.25; padding: 3px 6px; overflow: hidden }
.zblk { position: absolute; z-index: 1 }
.zblk .zt, .zchip .zt { display: block; font-size: 11.5px; color: var(--muted) }
.zblk .zc, .zchip .zc { font-size: 11.5px }
.zchip { display: block; width: 100%; margin-bottom: 4px }
.zchip .zc { display: block }
.zblk.clash, .zchip.clash { border-color: var(--seal); border-left-color: var(--seal); background: var(--seal-soft) }
.ztable td { vertical-align: top; min-width: 110px }
.ztable .zacc { text-align: left; white-space: nowrap; vertical-align: top }
.zdays { margin-bottom: 10px }
.zdays .lang { margin-left: 0; flex-wrap: wrap }
.zdays .lang button { border: 0; border-radius: 0; padding: 7px 12px; font-size: 13px; background: var(--surface); color: var(--fg); cursor: pointer }
.zdays .lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg) }
.zdays small { opacity: .7 }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px }
.vcard { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; align-content: start }
.vcard[hidden] { display: none }
.vhead { display: flex; align-items: center; gap: 10px }
.vbadge { width: 34px; height: 34px; border-radius: 9px; color: #fff; display: grid; place-items: center; font-weight: 700; flex: none }
.vline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0 }
.vline > .muted { width: 3.2em; flex: none; font-size: 13px }
.vline code { flex: 1; min-width: 0; overflow-wrap: anywhere; background: var(--sunken); padding: 3px 7px; border-radius: 6px; font-size: 13.5px }
.vline a { overflow-wrap: anywhere }
@media (max-width: 520px) { .vgrid { grid-template-columns: 1fr } }
.payseg { display: flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; width: max-content; max-width: 100% }
.payseg button { border: 0; background: var(--surface); color: var(--fg); padding: 7px 14px; font: inherit; font-size: 13.5px; cursor: pointer }
.payseg button + button { border-left: 1px solid var(--line) }
.payseg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg) }
#payform .stuonly[hidden], #payform .loconly[hidden], #payform .famrow[hidden] { display: none }
#stuform .hyonly[hidden], #stuform .lvonly[hidden], #payform .hypay[hidden] { display: none }
.payseg button[aria-pressed="true"] .muted { color: inherit; opacity: .8 }
html.fb [data-gsimport], html.fb [data-regimport], html.fb [data-webpull] { display: none !important; }
.owebanner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; border: 1px solid var(--seal); border-left-width: 4px; background: var(--seal-soft); color: var(--fg); border-radius: 6px; padding: 10px 12px }
.owebanner b { color: var(--seal) }
.muted { color: var(--muted) }
.empty { color: var(--muted); padding: 20px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r) }
.alert { border-left: 3px solid var(--seal); background: var(--seal-soft); border-radius: 6px; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center }
.alert .alhead { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; min-width: 0 }
.alert .alact { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end }
.alert .alact .btn.cur { border-color: var(--ink); font-weight: 700 }
.pausegrp { display: grid; gap: 10px }
.pausegrp > summary { cursor: pointer; color: var(--muted); font-size: 13.5px; padding: 4px 0 }
.pausegrp[open] > summary { margin-bottom: 2px }
.pausegrp .alert { border-left-color: var(--line, #ccc); background: transparent; border: 1px solid var(--line, #ddd); border-left-width: 3px }
@media (max-width: 760px) { .alert { grid-template-columns: 1fr } .alert .alact { grid-column: 1; grid-row: auto; justify-content: flex-start } }
.alert .who { font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px }
.alert .why { color: var(--muted); font-size: 12.5px }
.banner { background: var(--amber-soft); color: var(--amber); padding: 10px 12px; border-radius: 6px }
.day { display: grid; grid-template-columns: 88px 1fr; gap: 10px; padding-block: 8px; border-bottom: 1px solid var(--line) }
.day:last-child { border-bottom: 0 }
.day .d { font-weight: 700 } .day .d small { display: block; font-weight: 400; color: var(--muted) }
.day.today .d { color: var(--accent) }
.cls { background: var(--sunken); border-radius: 6px; padding: 7px 10px; cursor: pointer; display: grid; gap: 2px; min-width: 0 }
.cls:hover { outline: 1px solid var(--accent) }
.cls .t { font-variant-numeric: tabular-nums; font-weight: 500 }
.cls .s { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere }
.clslist { display: grid; gap: 6px; min-width: 0 }
.thumbs { display: flex; flex-wrap: wrap; gap: 6px }
.thumbs a, .thumbs .th { position: relative; display: block; width: 72px; height: 72px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--sunken) }
.thumbs img { width: 100%; height: 100%; object-fit: cover }
.thumbs .x { position: absolute; top: 2px; right: 2px; border: 0; background: rgba(0,0,0,.6); color: #fff; border-radius: 4px; font-size: 11px; cursor: pointer; padding: 0 4px }
/* A PDF receipt has no picture, so it shows as a paper tile with its file name. */
.pdft { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 2px; padding: 4px; background: var(--surface); text-align: center }
.pdft b { color: var(--accent); font-size: 13px; letter-spacing: .06em }
.pdft small { color: var(--muted); font-size: 10px; line-height: 1.25; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.private { background: var(--amber-soft); border-radius: 6px; padding: 10px 12px; display: grid; gap: 4px }
.private h3 { color: var(--amber) }
/* teacher portal: attendance photos and rows, grade sheet */
.pill.attmiss { background: var(--seal-soft); color: var(--seal) }
.attline { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center }
.attline .thumbs a, .attline .thumbs .th { width: 48px; height: 48px }
.th.attnone { display: grid !important; place-items: center; font-size: 11px; color: var(--muted); border-style: dashed !important }
.attphs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.attph { display: grid; gap: 6px; align-content: start; justify-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px }
.attph a { display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; background: var(--sunken) }
.attph img { width: 100%; height: 100%; object-fit: cover; display: block }
.attph0 { width: 100%; aspect-ratio: 4 / 3; border: 1px dashed var(--line); border-radius: 6px; display: grid; place-items: center; text-align: center; padding: 8px; color: var(--muted); font-size: 13px }
.attph label.busy { opacity: .6; pointer-events: none }
.kinfo { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 16px; background: var(--sunken); border-radius: var(--r); padding: 12px 14px }
.kinfo > div { display: grid; gap: 2px; font-size: 14px } .kinfo .muted { font-size: 12px }
.kfold > summary { cursor: pointer; list-style: revert } .kfold[open] > summary { margin-bottom: 8px }
.ksess { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface) }
.ksess > summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center }
.ksess .ksbody { display: grid; gap: 8px; margin-top: 8px }
.ksess .attth { display: flex; gap: 8px } .ksess .attth img, .ksess .attth .th { width: 96px; height: 72px; object-fit: cover; border-radius: 6px; display: grid; place-items: center }
.pill.att-p { background: var(--accent-soft) } .pill.att-l { background: #fdf0d5 } .pill.att-a { background: #f8dcd8 } .pill.att-x { background: var(--sunken) }
.docfile { gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px } .docfile a { word-break: break-all }
#docup.busy { opacity: .6; pointer-events: none }
.attph[tabindex]:focus, .attph.drop { outline: 2px solid var(--accent); outline-offset: 2px }
.attph0 { gap: 6px; align-content: center } .attph0 .phpaste { font-size: 12px; opacity: .8 }

#pdfroot table td, #pdfroot table th { border-bottom: 1px solid #d5dedb; padding: 5px 6px; color: #17211e }
#pdfroot .kv dt { color: #5d6b67 }
#pdfroot .rc { margin-top: 14px; text-align: center } #pdfroot .rc img { max-width: 100%; max-height: 860px; border: 1px solid #d5dedb }
#pdfroot .cap { font-size: 12px; color: #5d6b67; margin-bottom: 6px; text-align: left }
/* Opening splash, about 8 s: the seal's ring turns in around 思 and keeps turning slowly, the school name rises line by line, the thanks line follows with a light sweep over the name, and the bar fills to the end; it fades once data is in. A click skips it. */
#splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; overflow: auto; background: var(--surface); padding: 24px 16px; transition: opacity .6s ease, visibility .6s }
#splash.out { opacity: 0; visibility: hidden }
.sp-in { width: min(100%, 560px); display: flex; flex-direction: column; align-items: center; text-align: center; transition: transform .6s ease }
#splash.out .sp-in { transform: scale(1.04) }
.sp-mark { position: relative; width: clamp(150px, 36vw, 216px); aspect-ratio: 1; border-radius: 50%; background: #fff; margin-bottom: 22px }
.sp-mark img { position: absolute; inset: 0; width: 100%; height: 100% }
.sp-mark::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid #18a873; opacity: 0; animation: sp-ripple 2.4s .95s ease-out infinite }
.sp-ring { animation: sp-ring 1.1s cubic-bezier(.2, .8, .2, 1) both, sp-spin 48s 1.1s linear infinite }
.sp-core { animation: sp-core .7s .4s cubic-bezier(.2, .8, .2, 1) both }
.sp-l1, .sp-l2, .sp-l3 { display: block; height: auto; animation: sp-rise .6s cubic-bezier(.2, .8, .2, 1) both }
.sp-l1 { width: 100%; animation-delay: .8s }
.sp-l2 { width: 43.7%; margin-top: 1.2%; animation-delay: .95s }
.sp-l3 { width: 75.4%; margin-top: 1.4%; animation-delay: 1.1s }
.sp-thanks { margin: 26px 0 0; max-width: 30em; color: var(--muted); font-size: 14.5px; line-height: 1.6; animation: sp-rise .8s 1.6s cubic-bezier(.2, .8, .2, 1) both }
.sp-thanks b { display: table; margin: 4px auto 0; color: var(--accent); font-family: var(--f-display); font-size: 19px; letter-spacing: .06em;
  background-image: linear-gradient(100deg, transparent 40%, #9bf0cc 50%, transparent 60%), linear-gradient(var(--accent), var(--accent)); background-size: 260% 100%, 100% 100%; background-repeat: no-repeat; background-position: 120% 0, 0 0;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: sp-shine 2.8s 2.6s ease-in-out infinite }
.sp-bar { width: 168px; height: 4px; margin-top: 22px; border-radius: 2px; background: var(--sunken); overflow: hidden; animation: sp-fade .4s .3s both }
.sp-bar i { display: block; height: 100%; border-radius: inherit; background: #18a873; transform-origin: left; transform: scaleX(0); animation: sp-fill 7.5s .4s cubic-bezier(.45, .05, .35, 1) forwards }
@keyframes sp-ring { from { opacity: 0; transform: rotate(-160deg) scale(.8) } to { opacity: 1; transform: none } }
@keyframes sp-core { from { opacity: 0; transform: scale(.55) } to { opacity: 1; transform: none } }
@keyframes sp-ripple { 0% { opacity: .55; transform: scale(1) } 45%, 100% { opacity: 0; transform: scale(1.28) } }
@keyframes sp-spin { to { transform: rotate(360deg) } }
@keyframes sp-shine { 0% { background-position: 120% 0, 0 0 } 60%, 100% { background-position: -20% 0, 0 0 } }
@keyframes sp-rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
@keyframes sp-fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes sp-fill { to { transform: scaleX(1) } }
@media (prefers-reduced-motion: reduce) { #splash, #splash * { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important } }
@media print { #splash { display: none } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
@media (max-width: 520px) { .day { grid-template-columns: 1fr } .kv { grid-template-columns: 1fr } .kv dd { margin-bottom: 4px } }
</style>

/* ---------- 教师课表：每位老师一行。思源的课从课程安排自动算，合作学校等其他时间是手填的 ---------- */
const DAY_ES = ["LUNES", "MARTES", "MIÉRCOLES", "JUEVES", "VIERNES", "SÁBADO", "DOMINGO"];
// Spanish name for the timetable; pinyin stands in until one is filled.
const esName = x => x.nameEs || x.pinyin || "";
const TSK = { partner: "合作学校", other: "其他课程" };
const hhmm = t => { const m = String(t || "").trim().match(/^(\d{1,2})[:：.](\d{2})/); return m && +m[1] < 24 && +m[2] < 60 ? `${m[1].padStart(2, "0")}:${m[2]}` : ""; };
const tRange = s => `${s.start.replace(/^0(\d)/, "$1")}-${s.end.replace(/^0(\d)/, "$1")}`;
const bySlot = (a, b) => ((+a.d + 6) % 7) - ((+b.d + 6) % 7) || a.start.localeCompare(b.start);
// The hand-kept slots. Older records only had free text per weekday ("9:00-11:00 / 17:00-18:30").
function tSlots(x) {
  if (Array.isArray(x?.tslots)) return x.tslots;
  const out = [];
  for (const [d, txt] of Object.entries(x?.weekly || {})) for (const m of String(txt).matchAll(/(\d{1,2}[:：.]\d{2})\s*[-–—~]+\s*(\d{1,2}[:：.]\d{2})/g)) {
    const a = hhmm(m[1]), b = hhmm(m[2]); if (a && b) out.push({ d: +d, start: a, end: b, kind: "other", place: "" });
  }
  return out.sort(bySlot);
}
// One teacher's week: Siyuan classes come from the schedule, so holidays, cancellations and new courses show up by themselves.
// A day where two slots overlap is marked. A hand-kept "other" slot that falls inside a Siyuan class that day is that class written by hand, so the class stands for it; partner-school slots still show as a clash.
// which teaching site a timetable slot belongs to: Siyuan classes and partner schools say so; other classes count as online when their name says 网课/线上/online, otherwise as the main site
const ONLINE_RE = /网课|線上|线上|online|virtual|zoom/i;
const slotLoc = s => s.locationId || (s.kind === "other" ? (S.locations.find(l => l.type === (ONLINE_RE.test(`${s.place || ""} ${s.grp || ""}`) ? "线上" : "本部"))?.id || "") : "");
function tWeek(x, days, loc = "") {
  const cols = days.map(() => []), clash = [];
  for (const c of CL()) if (c.teacherId === x.id && c.start && c.end && (!loc || c.locationId === loc)) { const i = days.indexOf(c.date); if (i >= 0) cols[i].push({ id: c.id, start: c.start, end: c.end, kind: "siyuan", place: cname(c), online: locOf(c.locationId)?.type === "线上" }); }
  for (const s of tSlots(x)) { if (loc && slotLoc(s) !== loc) continue; const i = (+s.d + 6) % 7; if (!cols[i].some(y => y.start <= s.start && y.end >= s.end && ((y.kind === "siyuan" && s.kind === "other") || (y.start === s.start && y.end === s.end)))) cols[i].push(s); }
  cols.forEach((col, i) => {
    col.sort((a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
    let end = 0; for (const s of col) { const a = toMin(s.start), b = toMin(s.end); if (a < end) clash[i] = true; end = Math.max(end, b); }
  });
  return { cols, clash, any: cols.some(c => c.length) };
}
// 周一至周四 for a run of three or more days, 周一、周三 otherwise
function dayList(ix) {
  const nm = i => L(WDN[i]), out = [];
  for (let k = 0; k < ix.length;) { let j = k; while (j + 1 < ix.length && ix[j + 1] === ix[j] + 1) j++; out.push(j - k >= 2 ? L("{0}至{1}", nm(ix[k]), nm(ix[j])) : ix.slice(k, j + 1).map(nm).join(S.lang === "es" ? ", " : "、")); k = j + 1; }
  return out.join(S.lang === "es" ? ", " : "、");
}
// The course-details column: one line per school or class, with its days and the grades or groups written for it.
function tDetails(x, w) {
  const g = new Map(), pn = x.pnotes || {};
  w.cols.forEach((col, i) => col.forEach(s => { const k = `${s.kind}|${s.place || ""}`; if (!g.has(k)) g.set(k, { kind: s.kind, place: s.place || "", locationId: s.locationId || "", online: s.online, days: [] }); const e = g.get(k); if (!e.days.includes(i)) e.days.push(i); }));
  const order = { siyuan: 0, partner: 1, other: 2 };
  // the groups set up in 班级总表 come first, then anything written by hand for that place
  return [...g.values()].sort((a, b) => order[a.kind] - order[b.kind] || a.days[0] - b.days[0]).map(e => ({ ...e, note: e.kind === "siyuan" ? (e.online ? L("线上") : "") : [gText(slotGroups(x.id, e)), pn[e.place]].filter(Boolean).join(" · ") }));
}
const ttOrder = (a, b) => (a.ord ?? 999) - (b.ord ?? 999) || byName(a, b);
function ttData() {

  const mcp = S.mcp || (window.claude?.use ? await claude.use("mcp").catch(() => null) : null); if (!mcp) throw { code: "no_mcp" };

/* ---------- 备份：把数据库里所有资料读一遍，存成一个 Excel（一个集合一张表），每天提醒下载一次 ---------- */
const BAK_COLS = ["students", "payments", "courses", "classes", "teachers", "locations", "rooms", "holidays", "scores", "groups", "families", "leads", "items", "loans", "docs", "flyer", "zoom", "attendance", "grades", "accounts"];
// collections that can pass 1000 documents are read in yearly windows of their date field
const BAK_DATE = { payments: "date", classes: "date", attendance: "date" };
const bakDoc = () => S.flyer.find(x => x.id === "backup") || {};
const bakWhen = at => { const d = new Date(at); return isNaN(d) ? "" : ymd(d) + " " + d.toTimeString().slice(0, 5); };
const bakDue = () => !S.readOnly && bakWhen(bakDoc().at || "").slice(0, 10) !== today();
async function bakRead(col) {
  const rd = async q => (await q.get()).docs.map(d => ({ id: d.id, ...d.data() }));
  const c = S.db.collection(col), first = await rd(c.limit(1000));
  if (first.length < 1000 || !BAK_DATE[col]) return first;
  const f = BAK_DATE[col], y1 = +today().slice(0, 4) + 2, out = new Map();
  const add = xs => xs.forEach(x => out.set(x.id, x));
  add(await rd(c.where(f, "<", "2020-01-01").limit(1000)));
  for (let y = 2020; y <= y1; y++) for (const [a, b] of [["01-01", "07-01"], ["07-01", "13-01"]]) add(await rd(c.where(f, ">=", `${y}-${a}`).where(f, "<", b === "13-01" ? `${y + 1}-01-01` : `${y}-${b}`).limit(1000)));
  add(await rd(c.where(f, ">=", `${y1 + 1}-01-01`).limit(1000)));
  add(first);
  return [...out.values()];
}
async function backupNow(btn) {
  if (noPay()) return;
  if (!S.downloads || !S.db) return toast(L("这个环境不支持下载文件"));
  const lab = btn?.textContent; if (btn) btn.disabled = true;
  try {
    if (!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb = XLSX.utils.book_new(), counts = [];
    for (const col of BAK_COLS) {
      if (btn) btn.textContent = L("正在读取 {0}…", col);
      let rows = await bakRead(col);
      // sign-in secrets never leave the database
      if (col === "accounts") rows = rows.map(({ hash, salt, iter, ...r }) => r);
      const keys = ["id", ...new Set(rows.flatMap(r => Object.keys(r)).filter(k => k !== "id"))];
      const data = [keys, ...rows.map(r => keys.map(k => { const v = r[k]; return v == null ? "" : typeof v === "object" ? JSON.stringify(v) : v; }))];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(data), col.slice(0, 31));
      counts.push([col, rows.length]);
    }
    const now = new Date();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Siyuan backup", now.toISOString()], ["collection", "documents"], ...counts]), "_info");
    const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
    const blob = new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    await S.downloads.save({ filename: `Siyuan_backup_${today()}.xlsx`, data: blob });
    const { id, ...rest } = bakDoc();
    try { await save("flyer", "backup", { ...rest, at: now.toISOString(), by: S.acct?.id || "", counts: Object.fromEntries(counts) }); } catch { }
    toast(L("备份已下载"));
  } catch (e) { if (e?.code !== "declined") toast(L("备份失败：{0}", e?.message || e?.code || e)); }
  finally { if (btn) { btn.disabled = false; btn.textContent = lab; } }
}

function zClashes(list) {

  const PX = 52, top = m => (m - h0 * 60) * PX / 60, hrs = Array.from({ length: h1 - h0 }, (_, i) => h0 + i), hh = h => String(h).padStart(2, "0") + ":00";

async function studentHistory(id) {
  const [pc, cc] = await Promise.all([
    noPay() ? { docs: [] } : S.db.collection("payments").where("studentId", "==", id).get(),
    S.db.collection("classes").where("studentIds", "array-contains", id).get()]);
  const f = famOf(id), own = pc.docs.map(d => ({ id: d.id, ...d.data() }));
  const pays = [...own, ...(f ? S.payments.filter(p => p.familyId === f.id && !own.some(o => o.id === p.id)) : [])].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const ks = new Set(S.courses.map(k => k.id)), ov = kOv(), far = addDays(today(), 400);
  const cls = [...cc.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => !c.courseId || !ks.has(c.courseId)),

  return { pays, cls };
}

function waText(p) {

  if (p.item) lines.push(L("内容：{0}", p.item));
  if (p.receiptNo) lines.push(L("收据号：{0}", p.receiptNo));
  if (p.pending) lines.push(`⚠ ${p.balance != null ? L("还欠 {0}", money(p.balance)) : L("欠费")}`);
  if ((p.receipts || []).length) lines.push(`📎 ${p.receipts.some(r => rcPdf(p, r)) ? L("收据 {0} 份（含 PDF）", p.receipts.length) : L("收据照片 {0} 张", p.receipts.length)}`);
  return lines.join("\n");
}

// student list for a class or group: each name has 删除, and a search box below adds more
const stuPanel = () => `<div class="panel"><div class="row"><h3>${L("学生")} <span class="muted" id="cn"></span></h3></div>
      <div class="stulist" id="cstu"></div>
      <div class="row" style="margin-top:8px"><input id="cq" placeholder="${L("添加学生：输入名字或编号")}" autocomplete="off" style="flex:1;min-width:0"></div>
      <div class="stuadd" id="cadd"></div><div class="stuwarn" id="cwarn" hidden></div></div>`;
function stuPick(el, ids) {
  // 删除 only marks a student (struck through, with 撤销); nothing is removed until 保存, which asks once more
  const all = (ids || []).slice(), had = new Set(all), gone = new Set();
  let warned = "";
  const draw = () => {
    const n = all.filter(id => stu(id) && !gone.has(id)).length;
    $("#cn", el).textContent = `(${n})`;
    $("#cstu", el).innerHTML = all.filter(id => stu(id)).map(id => gone.has(id)
      ? `<span class="stuchip gone"><s>${esc(sname(stu(id)))}</s><button type="button" class="btn small" data-undostu="${id}">${L("撤销")}</button></span>`
      : `<span class="stuchip"><a href="#" data-gostu="${id}">${esc(sname(stu(id)))}</a><button type="button" class="btn small" data-rmstu="${id}" title="${L("从这里移除")}">${L("移除")}</button></span>`).join("") || `<span class="muted">${L("还没有学生，在下面搜索添加。")}</span>`;
    const q = fold($("#cq", el).value.trim()), lid = el.querySelector("[name=locationId]")?.value || "";
    const hits = q ? S.students.filter(s => (!all.includes(s.id) || gone.has(s.id)) && s.status !== "已退学" && fold([s.nameZh, s.nameEs, s.code].join(" ")).includes(q)).sort((a, b) => ((b.locationId === lid) - (a.locationId === lid)) || ((a.status === "不上课了") - (b.status === "不上课了")) || sname(a).localeCompare(sname(b), "zh")).slice(0, 12) : [];
    $("#cadd", el).innerHTML = q ? hits.map(s => `<button type="button" class="btn small" data-addstu="${s.id}">＋ ${esc(sname(s))} <span class="muted">${esc(s.code || "")}</span> ${pill(s.status || "上课中")}</button>`).join("") || `<span class="muted">${L("没找到")}</span>` : "";
    const lost = all.filter(id => gone.has(id) && had.has(id));
    $("#cwarn", el).hidden = !lost.length;
    $("#cwarn", el).textContent = lost.length ? L("保存后会移除：{0}", lost.map(id => sname(stu(id))).join("、")) : "";
  };
  $("#cq", el).addEventListener("input", draw);
  $("#cq", el).addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#cadd [data-addstu]", el)?.click(); } });
  el.addEventListener("click", e => {
    const a = e.target.closest("[data-addstu]"); if (a) { const id = a.dataset.addstu; if (gone.has(id)) gone.delete(id); else all.push(id); $("#cq", el).value = ""; draw(); $("#cq", el).focus(); }
    const r = e.target.closest("[data-rmstu]"); if (r) { const id = r.dataset.rmstu; if (had.has(id)) gone.add(id); else all.splice(all.indexOf(id), 1); draw(); }
    const u = e.target.closest("[data-undostu]"); if (u) { gone.delete(u.dataset.undostu); draw(); }
    const g = e.target.closest("[data-gostu]"); if (g) { e.preventDefault(); if (gone.size || all.some(id => !had.has(id))) return toast(L("名单有改动，请先保存再打开学生")); openStudent(g.dataset.gostu); }
  });
  draw();
  return {
    ids: () => all.filter(id => !gone.has(id)),
    // first 保存 with removals only shows the warning; the second one goes through
    ok() {
      const lost = all.filter(id => gone.has(id) && had.has(id)), key = lost.join();
      if (!lost.length || warned === key) return true;
      warned = key; const w = $("#cwarn", el); w.textContent = L("确定要从这里移除 {0} 名学生：{1}？确定的话请再点一次“保存”。", lost.length, lost.map(id => sname(stu(id))).join("、")); w.scrollIntoView({ block: "center" });
      return false;
    }
  };
}

// Cuts what is drawn in #pdfroot into pages at the edges of its .pb blocks; the first page has no top margin because the page has its own padding.
async function rootPdf(root, W, PH, MT) {
  const scale = 2, land = W > PH ? "landscape" : "portrait";
  const cv = await html2canvas(root, { scale, backgroundColor: "#ffffff", useCORS: true, logging: false, windowWidth: W });
  // page breaks at block edges
  const top0 = root.getBoundingClientRect().top;
  const edges = [...root.querySelectorAll(".pb")].map(b => b.getBoundingClientRect().top - top0);
  const totalH = root.scrollHeight; const pages = []; let y = 0;
  while (y < totalH - 2) {
    const lim = y + (pages.length ? PH - MT * 2 : PH - MT);
    if (lim >= totalH) { pages.push([y, totalH]); break; }
    let cut = 0; for (const t of edges) if (t > y + 40 && t <= lim) cut = Math.max(cut, t);
    if (!cut) cut = lim; pages.push([y, cut]); y = cut;
  }
  const { jsPDF } = window.jspdf; const pdf = new jsPDF({ unit: "px", format: [W, PH], orientation: land, hotfixes: ["px_scaling"] });
  pages.forEach(([a, b], i) => {
    if (i) pdf.addPage([W, PH], land);
    const pc = document.createElement("canvas"); pc.width = W * scale; pc.height = Math.ceil((b - a) * scale);
    const cx = pc.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, pc.width, pc.height);
    cx.drawImage(cv, 0, Math.floor(a * scale), pc.width, pc.height, 0, 0, pc.width, pc.height);
    pdf.addImage(pc.toDataURL("image/jpeg", 0.9), "JPEG", 0, i ? MT : 0, W, b - a);
    pdf.setFontSize(9); pdf.setTextColor(130); pdf.text(`${i + 1} / ${pages.length}`, W - 56, PH - 20);
  });
  return pdf.output("blob");
}

// adding or removing a student changes the whole class for a repeating class (and any session that has its own list), or the one-off class itself

  const gd = t.closest("[data-grade]"); if (gd) { const g = gradeGroup(gd.dataset.grade); if (g) gradesForm(g); return true; }
  const ts = t.closest("[data-tstu]"); if (ts) { const s = stu(ts.dataset.tstu); if (s) tStudentForm(s); return true; }

  if (t.closest("[data-tnewcls]")) { classForm(); return true; }
  if (t.closest("[data-rqcancel],[data-rqsub],[data-rqno],[data-rqmove]")) { rqClick(t); return true; }
  const ts2 = t.closest("[data-tchst]"); if (ts2) { S.tchSt = ts2.dataset.tchst; render(); return true; }

  return false;

// opens accounts for several teachers at once: username from the Spanish name, the shared first password, a new password asked on first sign-in
function tAcctBulk(list) {
  if (!FB || !isOwner()) return;
  list = list || S.teachers.filter(x => tStatus(x) !== "离职" && !tAcct(x)).sort(byName);
  const taken = new Set(S.accounts.map(a => a.id)), pre = {};
  for (const x of list) { let b = unameOf(x), u = b, n = 2; if (b) { while (taken.has(u)) u = b + n++; taken.add(u); } pre[x.id] = u; }
  const el = openSheet(`<div style="display:grid;gap:12px">
    <div class="row"><h2>${L("给老师开账号")}</h2><span class="spacer"></span><button type="button" class="btn" data-close>${L("关闭")}</button><button type="button" class="btn primary" data-tbgo>${L("开通选中的账号")}</button></div>
    <p class="muted" style="margin:0;font-size:13px">${esc(L("用户名用老师的西语名（可以改），初始密码都是 {0}。老师第一次登录时必须改成自己的密码。", T_PW0))}</p>
    <div class="tablewrap"><table><thead><tr><th></th><th>${L("老师")}</th><th>${L("用户名")}</th><th>${L("结果")}</th></tr></thead><tbody>
    ${list.map(x => `<tr data-tbrow="${x.id}"><td><input type="checkbox" ${pre[x.id] ? "checked" : ""} style="width:auto"></td><td class="nm"><b>${esc(x.name || "")}</b> <span class="muted">${esc(x.nameEs || "")}</span></td><td><input class="tbu" value="${esc(pre[x.id])}" placeholder="${L("请填用户名")}" autocapitalize="none" spellcheck="false" style="width:12em"></td><td class="tbres muted"></td></tr>`).join("")}
    </tbody></table></div>
    <div id="tbdone" hidden class="panel"><h3>${L("发给老师")}</h3><textarea id="tbtext" rows="6" readonly></textarea><div class="row"><span class="spacer"></span><button type="button" class="btn small" data-tbcopy>${L("复制")}</button></div></div>
  </div>`);
  el.addEventListener("click", async e => {
    if (e.target.closest("[data-close]")) closeSheet();
    if (e.target.closest("[data-tbcopy]")) { const tx = $("#tbtext", el).value; try { await navigator.clipboard.writeText(tx); } catch { $("#tbtext", el).select(); document.execCommand("copy"); } toast(L("已复制")); return; }
    const go = e.target.closest("[data-tbgo]"); if (!go) return;
    go.disabled = true; const ok = [];
    for (const r of el.querySelectorAll("[data-tbrow]")) {
      const x = tch(r.dataset.tbrow), cb = r.querySelector("input[type=checkbox]"), res = r.querySelector(".tbres"), u = r.querySelector(".tbu").value.trim().toLowerCase();
      if (!cb.checked || cb.disabled) continue;
      if (!ID_RE.test(u)) { res.textContent = L("用户名只能用小写字母、数字和 . _ -，2 到 32 位。"); continue; }
      res.textContent = L("开通中…");
      try { await FB.call("saveAccount", { uname: u, isNew: true, name: x.nameEs || x.name, role: "teacher", active: true, scores: false, teacherId: x.id, pw: T_PW0 }); res.textContent = "✓"; res.classList.remove("muted"); cb.disabled = true; ok.push(`${x.name || ""}${x.nameEs ? " " + x.nameEs : ""}：${u}`); }
      catch (err) { res.textContent = err?.message || err?.code || String(err); }
    }
    go.disabled = false;
    if (ok.length) { $("#tbdone", el).hidden = false; $("#tbtext", el).value = `${L("思源系统老师账号")} ${location.origin}\n${L("初始密码：{0}（第一次登录会让你改成自己的密码）", T_PW0)}\n\n${ok.join("\n")}`; toast(L("开通了 {0} 个账号", ok.length)); }
  });
}

// first sign-in with the shared password (or after a reset): a new password must be set before anything else
function forcePw() {
  if (!FB || !S.acct?.mustChangePw || $("#forcepw")) return;
  const el = openSheet(`<form id="forcepw" style="display:grid;gap:12px">
    <h2 style="margin:0">${L("请设置你自己的密码")}</h2>
    <p class="muted" style="margin:0">${esc(L("你现在用的是初始密码。设好新密码以后，下次就用新密码登录，用户名还是 {0}。", S.acct.id))}</p>
    <div class="grid2"><label class="f">${L("新密码")}<input name="pw" type="password" autocomplete="new-password"></label><label class="f">${L("再输入一次新密码")}<input name="pw2" type="password" autocomplete="new-password"></label></div>
    <p class="login-err" id="fpmsg" role="alert"></p>
    <div class="row"><button type="button" class="btn" data-fplogout>${L("退出登录")}</button><span class="spacer"></span><button class="btn primary">${L("保存新密码")}</button></div>
  </form>`, true);
  // clicking outside does not close it
  el.addEventListener("mousedown", e => { if (e.target === el) e.stopImmediatePropagation(); }, true);
  el.addEventListener("click", e => { if (e.target.closest("[data-fplogout]")) signOut(L("已退出登录")); });
  $("#forcepw", el).addEventListener("submit", async e => {
    e.preventDefault(); const fd = new FormData(e.target), pw = String(fd.get("pw")), say = m => { $("#fpmsg", el).textContent = m; }, btn = e.target.querySelector(".btn.primary");
    const bad = pwProblem(pw, String(fd.get("pw2"))); if (bad) return say(bad);
    if (pw === T_PW0) return say(L("新密码不能和初始密码一样。"));
    btn.disabled = true;
    try { await FB.user.updatePassword(pw); }
    catch (err) { btn.disabled = false; if (/requires-recent-login/.test(err?.code || "")) return signOut(L("请重新登录，再设置新密码。")); return say(L("保存失败：{0}", err?.message || err?.code || err)); }
    try { await S.db.collection("accounts").doc(S.acct.id).update({ mustChangePw: false }); } catch { }
    S.acct = { ...S.acct, mustChangePw: false }; closeSheet(); toast(L("密码已修改"));
  });
}

/* ---------- 上课记录：带过的班、代课、换老师，每月上了多少节 ---------- */
// the teacher a session was planned for, when somebody else covered it ("" when nobody did)
const subOf = c => { const o = c._base ? c._base.teacherId : c.subFor; return o && o !== c.teacherId ? o : ""; };
const addMon = (m, n) => { const d = new Date(+m.slice(0, 4), +m.slice(5) - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };
// what a teacher taught in a month (or any date range), up to today: sessions, hours, covers for others, own sessions others covered
function tStats(id, from, to) {
  const t = today(), end = to < t ? to : t, mine = CL().filter(c => c.date >= from && c.date <= end && c.teacherId === id);
  return { n: mine.length, h: mine.reduce((s, c) => s + slotHrs(c.start, c.end), 0), sub: mine.filter(c => subOf(c)).length, att: mine.filter(c => !attMissing(c).length).length,
    lost: CL().filter(c => c.date >= from && c.date <= end && subOf(c) === id).length };
}
const monRange = m => [m + "-01", addDays(addMon(m, 1) + "-01", -1)];
const everTaught = (k, id) => k.teacherId === id || (k.tHist || []).some(h => h.teacherId === id);
const hName = h => tdisp(tch(h.teacherId)) || h.teacher || L("未定老师");

function tchStatsPanel() {
  const m = S.tchMon || today().slice(0, 7), [a, b] = monRange(m), old = S.since && a < S.since;
  const rows = S.teachers.slice().sort(byName).map(x => ({ x, s: tStats(x.id, a, b) })).filter(r => r.s.n || r.s.lost || (tStatus(r.x) === "在职" && m === today().slice(0, 7)));
  const tot = rows.reduce((t, r) => ({ n: t.n + r.s.n, h: t.h + r.s.h }), { n: 0, h: 0 });
  return `<section class="panel">
    <div class="row"><h2>${L("上课统计")}</h2><div class="row" style="gap:4px"><button type="button" class="btn small" data-tchmon="-1" aria-label="${L("上个月")}">‹</button><b style="min-width:7.5em;text-align:center">${esc(monthLabel(m))}</b><button type="button" class="btn small" data-tchmon="1" aria-label="${L("下个月")}" ${m >= today().slice(0, 7) ? "disabled" : ""}>›</button></div>
      <span class="muted">${esc(L("合计 {0} 节 · {1} 小时", tot.n, fmtH(tot.h)))}</span></div>
    ${old ? `<p class="muted" style="margin:0;font-size:12.5px">${esc(L("系统只读最近 200 天的课，{0} 之前的不全。", S.since))}</p>` : ""}
    ${rows.length ? `<div class="tablewrap"><table><thead><tr><th>${L("老师")}</th><th>${L("上了几节")}</th><th>${L("小时")}</th><th>${L("其中代课")}</th><th>${L("被别人代")}</th><th>${L("考勤完成")}</th></tr></thead><tbody>
    ${rows.map(({ x, s }) => `<tr class="click" data-tpage="${x.id}"><td class="nm">${tdot(x.id)}<b>${esc(x.name || "")}</b> <span class="muted">${esc(x.nameEs || "")}</span></td><td><b>${s.n}</b></td><td>${fmtH(s.h)}</td><td>${s.sub || '<span class="muted">—</span>'}</td><td>${s.lost || '<span class="muted">—</span>'}</td><td>${s.n ? `${s.att} / ${s.n}` : '<span class="muted">—</span>'}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty">${L("这个月还没有上过课")}</div>`}
    <p class="muted" style="margin:0;font-size:12.5px">${L("只算到今天、没取消的课。代课算在实际上课的老师名下。")}</p>
  </section>`;
}

// the teacher page's record: monthly counts, classes taught before, covers and teacher changes
function tRecordHtml(x) {
  const t = today(), m0 = t.slice(0, 7), on = new Set(groupsOf(x.id).filter(g => g.on).map(g => g.courseId).filter(Boolean));
  const months = [0, 1, 2, 3, 4, 5].map(i => addMon(m0, -i)).filter(m => !S.since || monRange(m)[1] >= S.since).map(m => ({ m, s: tStats(x.id, ...monRange(m)) }));
  const pastK = S.courses.filter(k => everTaught(k, x.id) && !on.has(k.id) && (k.start || "") <= t).sort((a, b) => (b.end || b.start || "").localeCompare(a.end || a.start || ""));
  const pastG = groupsOf(x.id).filter(g => !g.on && !g.courseId && g.sess.length > 1);
  const span = k => { const hs = (k.tHist || []).slice().sort((a, b) => a.until.localeCompare(b.until)); let from = k.start, out = []; for (const h of hs) { if (h.teacherId === x.id) out.push(`${from} – ${addDays(h.until, -1)}`); from = h.until; } if (k.teacherId === x.id) out.push(`${from} – ${k.end || ""}`); return out.join("、"); };
  const subs = CL().filter(c => c.date <= addDays(t, 60) && (c.teacherId === x.id && subOf(c) || subOf(c) === x.id)).sort((a, b) => b.date.localeCompare(a.date) || (b.start || "").localeCompare(a.start || "")).slice(0, 40);
  const cxs = S.classes.filter(c => c.cancelled && (c.teacherId || (k => k ? tAt(k, c.date).teacherId : "")(S.courses.find(k => k.id === c.courseId))) === x.id).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 30);
  const rqs = S.requests.filter(r => r.teacherId === x.id).sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || "")).slice(0, 30);
  const chg = S.courses.flatMap(k => { const hs = (k.tHist || []).slice().sort((a, b) => a.until.localeCompare(b.until)); return hs.map((h, i) => ({ k, from: h.until, a: h, b: hs[i + 1] || { teacherId: k.teacherId, teacher: k.teacher } })).filter(r => r.a.teacherId === x.id || r.b.teacherId === x.id); }).sort((p, q) => q.from.localeCompare(p.from));
  return `<div class="panel"><h3>${L("上课记录")}</h3>
    <div class="tablewrap"><table><thead><tr><th>${L("月份")}</th><th>${L("上了几节")}</th><th>${L("小时")}</th><th>${L("其中代课")}</th><th>${L("被别人代")}</th></tr></thead><tbody>
    ${months.map(({ m, s }) => `<tr><td>${esc(monthLabel(m))}</td><td><b>${s.n}</b></td><td>${fmtH(s.h)}</td><td>${s.sub || '<span class="muted">—</span>'}</td><td>${s.lost || '<span class="muted">—</span>'}</td></tr>`).join("")}
    </tbody></table></div>
    <h3>${L("带过的班")}</h3>
    ${pastK.length || pastG.length ? `<div class="tablewrap"><table><thead><tr><th>${L("班级")}</th><th>${L("带班时间")}</th><th>${L("学生")}</th></tr></thead><tbody>
      ${pastK.map(k => `<tr${gradeGroup(k.id + "_" + x.id) ? ` class="click" data-pgrade="${esc(k.id + "_" + x.id)}"` : ""}><td class="nm"><b>${esc(cname(k))}</b>${k.teacherId !== x.id ? ` <span class="pill st-试听">${esc(L("已换给 {0}", tdisp(tch(k.teacherId)) || k.teacher || L("未定老师")))}</span>` : ""}</td><td>${esc(span(k))}</td><td>${(k.studentIds || []).length}</td></tr>`).join("")}
      ${pastG.map(g => `<tr class="click" data-pgrade="${esc(g.id)}"><td class="nm"><b>${esc(g.label)}</b></td><td>${esc(`${g.first.date} – ${g.last.date}`)}</td><td>${g.sids.size}</td></tr>`).join("")}
    </tbody></table></div>` : `<span class="muted">${L("还没有结束的班")}</span>`}
    <h3>${L("代课、换老师和停课")}</h3>
    ${subs.length || chg.length ? `<div class="clslist">
      ${chg.map(r => `<div class="row" style="gap:8px"><span class="muted" style="width:6.5em;flex:none">${esc(r.from)}</span><span>${esc(L("“{0}”从这天起由 {1} 换成 {2}", cname(r.k), hName(r.a), hName(r.b)))}</span>${r.a.by ? `<span class="muted" style="font-size:12px">${esc(byWho(r.a.by, r.a.at))}</span>` : ""}</div>`).join("")}
      ${subs.map(c => { const by = c.teacherId === x.id; return `<div class="row" style="gap:8px"><span class="muted" style="width:6.5em;flex:none">${esc(c.date)} ${esc(c.start || "")}</span><span class="pill ${by ? "st-上课中" : "st-待排课"}">${L(by ? "代课" : "被代")}</span><span>${esc(by ? L("替 {0} 上“{1}”", tdisp(tch(subOf(c))) || "?", cname(c)) : L("“{0}”由 {1} 代上", cname(c), tdisp(tch(c.teacherId)) || "?"))}</span>${c.subBy ? `<span class="muted" style="font-size:12px">${esc(byWho(c.subBy, c.subAt))}</span>` : ""}</div>`; }).join("")}
    </div>` : `<span class="muted">${L("没有代课或换老师的记录")}</span>`}
    ${cxs.length ? `<h3>${L("停课记录")}</h3><div class="clslist">${cxs.map(c => { const k = S.courses.find(y => y.id === c.courseId); return `<div class="row" style="gap:8px"><span class="muted" style="width:6.5em;flex:none">${esc(c.date)} ${esc(c.start || "")}</span><span class="pill attmiss">${L("停课")}</span><span>${esc(cname(k || c) || L("课程"))}</span><span>${esc(c.cancelReason ? L("原因：{0}", c.cancelReason) : L("没写原因"))}</span>${c.cancelledBy ? `<span class="muted" style="font-size:12px">${esc(byWho(c.cancelledBy, c.cancelledAt))}</span>` : ""}</div>`; }).join("")}</div>` : ""}
    ${rqs.length ? `<h3>${L("老师的申请")}</h3><div class="tablewrap"><table><thead><tr><th>${L("课")}</th><th>${L("申请")}</th><th>${L("原因")}</th><th>${L("结果")}</th></tr></thead><tbody>${rqs.map(r => `<tr><td>${esc(r.date)} ${esc(r.start)} · ${esc(r.label)}</td><td>${L(RQ_KIND[r.kind] || r.kind)}</td><td>${esc(r.reason || "")}</td><td>${esc(rqResult(r))}${r.handledBy ? `<div class="muted" style="font-size:12px">${esc(byWho(r.handledBy, r.handledAt))}</div>` : ""}</td></tr>`).join("")}</tbody></table></div>` : ""}
  </div>`;
}

// one teacher off for a while (休假): pick who covers each of their sessions in the date range
function subForm(x) {
  let from = today(), to = addDays(from, 13);
  const others = S.teachers.filter(t => t.id !== x.id && tStatus(t) === "在职").sort(byName);
  const el = openSheet(`<form id="subform" style="display:grid;gap:12px">
    <div class="row"><h2>${esc(L("安排代课：{0}", tdisp(x)))}</h2><span class="spacer"></span><button type="button" class="btn" data-close>${L("取消")}</button><button class="btn primary">${L("保存")}</button></div>
    <p class="muted" style="margin:0;font-size:13px">${L("选一段日期，给这位老师的每节课选代课老师。代课只改这几节，班级本身的老师不变；记录会算在实际上课的老师名下。要长期换老师，请到“编辑班级”里改老师。")}</p>
    <div class="grid2"><label class="f">${L("从")}<input name="from" data-dp readonly value="${from}"></label><label class="f">${L("到")}<input name="to" data-dp readonly value="${to}"></label></div>
    <label class="f">${L("这段时间都由谁代")}<select name="all"><option value="">${L("一节一节选")}</option>${others.map(t => `<option value="${t.id}">${esc(tboth(t))}</option>`).join("")}</select></label>
    <div id="sublist"></div>
  </form>`, true);
  const rows = () => CL().filter(c => c.date >= from && c.date <= to && (c.teacherId === x.id || subOf(c) === x.id)).sort(byStart);
  const draw = () => { const r = rows(); $("#sublist", el).innerHTML = r.length ? `<div class="tablewrap"><table><thead><tr><th>${L("日期")}</th><th>${L("班级")}</th><th>${L("谁来上")}</th></tr></thead><tbody>${r.map(c => `<tr><td>${esc(wd(c.date))} ${esc(c.date.slice(5))} ${esc(c.start || "")}</td><td class="nm">${esc(cname(c) || L("课程"))}</td><td><select data-subrow="${esc(c.id)}"><option value="${x.id}">${esc(L("{0}（原老师）", tdisp(x)))}</option>${others.map(t => `<option value="${t.id}" ${c.teacherId === t.id ? "selected" : ""}>${esc(tboth(t))}</option>`).join("")}${c.teacherId && c.teacherId !== x.id && !others.some(t => t.id === c.teacherId) ? `<option value="${c.teacherId}" selected>${esc(tdisp(tch(c.teacherId)) || "?")}</option>` : ""}</select></td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">${L("这段时间没有课")}</div>`; };
  draw();
  el.addEventListener("change", e => {
    if (e.target.name === "from" || e.target.name === "to") { from = el.querySelector("[name=from]").value; to = el.querySelector("[name=to]").value; if (to < from) to = from; draw(); }
    if (e.target.name === "all" && e.target.value) el.querySelectorAll("[data-subrow]").forEach(s => { s.value = e.target.value; });
  });
  el.addEventListener("click", e => { if (e.target.closest("[data-close]")) closeSheet(); });
  $("#subform", el).addEventListener("submit", async e => {
    e.preventDefault(); const btn = e.target.querySelector(".btn.primary"); btn.disabled = true; let n = 0;
    try { for (const s of el.querySelectorAll("[data-subrow]")) { const c = CL().find(y => y.id === s.dataset.subrow); if (c && s.value !== c.teacherId) { await setSessTeacher(c, s.value); n++; } } closeSheet(); toast(n ? L("已安排 {0} 节代课", n) : L("没有改动")); }
    catch { btn.disabled = false; }
  });
}
// one session taught by someone else; picking the planned teacher again undoes the cover
async function setSessTeacher(c, nt) {
  const raw = S.classes.find(y => y.id === c.id), d = raw ? { ...raw } : { courseId: c.courseId, date: c.date }; delete d.id;
  const orig = c._base ? c._base.teacherId : (d.subFor || d.teacherId || "");
  if (c._base) { if (nt === orig) { delete d.teacherId; delete d.subFor; } else { d.teacherId = nt; d.subFor = orig; } }
  else if (raw) { d.teacherId = nt; if (nt === orig) delete d.subFor; else d.subFor = orig; }
  else return;
  if (d.subFor) { d.subBy = S.acct.id; d.subAt = new Date().toISOString(); } else { delete d.subBy; delete d.subAt; }
  await save("classes", c.id, d);
}

/* ---------- 停课 / 代课申请：老师在自己的课上申请，后台同意停课、安排代课或不同意 ---------- */
const RQ_KIND = { cancel: "申请停课", sub: "找人代课", move: "改时间补课" };
// a session moved to another day (补课) remembers where it came from
const movedPill = c => c.movedFrom ? `<span class="pill st-试听">${esc(L("补课（原 {0}）", c.movedFrom.slice(5)))}</span> ` : "";
const rqOf = id => S.requests.filter(r => r.sessionId === id).sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""))[0];
const rqOpen = () => S.requests.filter(r => r.status === "open").sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.start || "").localeCompare(b.start || ""));
const rqPill = r => !r ? "" : r.status === "open" ? `<span class="pill st-待排课">${esc(L("{0}，等待处理", L(RQ_KIND[r.kind] || r.kind)))}</span>`
  : r.status === "rejected" ? `<span class="pill attmiss">${esc(L("申请没有通过"))}</span>` : "";
const byWho = (u, at) => u ? L("{0} 操作", u) + (at ? " · " + fmtTime(at) : "") : "";

// the teacher's box inside a session: ask to cancel it or to get a substitute
function rqBoxHtml(c) {
  const r = rqOf(c.id);
  if (r && r.status === "open") return `<div class="panel" id="rqbox"><div class="row"><h3>${L("停课 / 代课")}</h3>${rqPill(r)}<span class="spacer"></span><button type="button" class="btn small" data-rqwd="${esc(r.id)}">${L("撤回申请")}</button></div>
    <p class="muted" style="margin:0;font-size:13px">${esc(L("原因：{0}", r.reason || "—"))}</p></div>`;
  return `<details class="panel" id="rqbox"><summary><b>${L("这节课上不了？申请停课或找人代课")}</b>${r && r.status === "rejected" ? ` ${rqPill(r)}${r.reply ? ` <span class="muted">${esc(r.reply)}</span>` : ""}` : ""}</summary>
    <div style="display:grid;gap:10px;margin-top:10px">
      <div class="payseg" role="group" style="flex-wrap:wrap">${Object.entries(RQ_KIND).map(([k, l], i) => `<button type="button" data-rqk="${k}" aria-pressed="${i === 0}">${L(l)}</button>`).join("")}</div>
      <div class="grid2" id="rqmove" hidden><label class="f">${L("补课日期")}<input class="rqin" data-rqd data-dp readonly autocomplete="off" placeholder="YYYY-MM-DD"></label><div class="grid2" style="grid-template-columns:1fr 1fr"><label class="f">${L("开始")}<input class="rqin" type="time" data-rqs value="${esc(c.start || "")}"></label><label class="f">${L("结束")}<input class="rqin" type="time" data-rqe value="${esc(c.end || "")}"></label></div></div>
      <label class="f">${L("原因")}<textarea data-rqr rows="2" placeholder="${L("例：生病、家里有事、学校有活动")}"></textarea></label>
      <div class="row"><span class="muted" style="font-size:12.5px">${L("办公室同意以后这节课才会停或换人，结果会显示在“我的课表”最上面。")}</span><span class="spacer"></span><button type="button" class="btn small primary" data-rqsend>${L("提交申请")}</button></div>
    </div></details>`;
}
function wireRq(el, c) {
  el.addEventListener("click", async e => {
    const k = e.target.closest("[data-rqk]"); if (k) { k.parentElement.querySelectorAll("[data-rqk]").forEach(x => x.setAttribute("aria-pressed", String(x === k))); $("#rqmove", el).hidden = k.dataset.rqk !== "move"; return; }
    const wd0 = e.target.closest("[data-rqwd]"); if (wd0) { wd0.disabled = true; try { await S.db.collection("requests").doc(wd0.dataset.rqwd).update({ status: "withdrawn", updatedAt: new Date().toISOString() }); toast(L("已撤回")); $("#rqbox", el).outerHTML = rqBoxHtml(c); } catch (err) { wd0.disabled = false; toast(L("保存失败：{0}", err?.message || err?.code || err)); } return; }
    const go = e.target.closest("[data-rqsend]"); if (!go) return;
    const kind = el.querySelector("[data-rqk][aria-pressed=true]")?.dataset.rqk || "cancel", reason = el.querySelector("[data-rqr]").value.trim();
    if (!reason) return toast(L("请写一下原因"));
    const mv = kind === "move" ? { newDate: el.querySelector("[data-rqd]").value, newStart: el.querySelector("[data-rqs]").value, newEnd: el.querySelector("[data-rqe]").value } : {};
    if (kind === "move") { if (!mv.newDate) return toast(L("请选补课的日期")); if (!mv.newStart || !mv.newEnd || toMin(mv.newEnd) <= toMin(mv.newStart)) return toast(L("请把补课时间填完整"));
      if (mv.newDate < today()) return toast(L("补课日期不能早于今天")); if (mv.newDate === c.date && mv.newStart === c.start) return toast(L("补课时间和原来一样")); }
    go.disabled = true;
    const d = { kind, reason, ...mv, status: "open", sessionId: c.id, courseId: c.courseId || "", date: c.date, start: c.start || "", end: c.end || "", label: cname(c) || "", teacherId: myTid(), createdAt: new Date().toISOString(), createdBy: S.acct.id };
    try { const ref = S.db.collection("requests").doc(); await ref.set(d); S.requests = [...S.requests.filter(x => x.id !== ref.id), { id: ref.id, ...d }]; toast(L("已提交，等办公室处理")); $("#rqbox", el).outerHTML = rqBoxHtml(c); }
    catch (err) { go.disabled = false; toast(L("保存失败：{0}", err?.message || err?.code || err)); }
  });
}

// the office's list of open requests (首页提醒 and 教师)
function rqPanel() {
  const list = rqOpen(); if (!list.length) return "";
  return `<section class="panel" id="rqpanel"><div class="row"><h2>${L("老师的申请")}</h2><span class="pill st-待排课">${esc(L("{0} 条等待处理", list.length))}</span></div>

    ${list.map(r => { const c = CL().find(x => x.id === r.sessionId), x = tch(r.teacherId); return `<tr data-rqrow="${esc(r.id)}">

  const ga = t.closest("[data-gall]"); if (ga) { const open = ga.dataset.gall === "1"; document.querySelectorAll("details.gsec").forEach(d => { d.open = open; gOpen[d.dataset.gk] = open; }); try { localStorage.setItem("sy-gopen", JSON.stringify(gOpen)); } catch { } return; }
  const tt = t.closest("[data-tt]"); if (tt) { e.preventDefault(); const x = S.teachers.find(y => y.id === tt.dataset.tt); if (x) tsForm(x); return; }
  const te = t.closest("[data-tch]"); if (te) { teacherForm(S.teachers.find(x => x.id === te.dataset.tch)); return; }
  if (t.closest("[data-me]")) { S.openId = null; myAccount(); return; }
  const ac = t.closest("[data-acct]"); if (ac) { if (isOwner()) accountForm(S.accounts.find(x => x.id === ac.dataset.acct)); return; }
  const act = t.closest("[data-act]"); if (act) { S.openId = null; if (act.dataset.act === "newstu") studentForm(); if (act.dataset.act === "scanform") { studentForm(); $("#formscan")?.click(); } if (act.dataset.act === "csv") exportCsv(); if (act.dataset.act === "backup") backupNow(act); if (act.dataset.act === "ttcsv") exportTT(); if (act.dataset.act === "ttpdf") ttPdf(act); if (act.dataset.act === "flypdf") flyPdf(act); if (act.dataset.act === "flyreset") confirmBox(L("文字恢复成模板"), L("费用、要求、HSK、联系人这些文字会换回模板里的内容，选的班和每个班的文字不变。"), () => flySave(Object.fromEntries(Object.entries(FLY_DEF)))); if (act.dataset.act === "newroom") roomForm(); if (act.dataset.act === "newhol") holidayForm(); if (act.dataset.act === "newloc") locationForm(); if (act.dataset.act === "newtch") teacherForm(); if (act.dataset.act === "newk") courseForm(); if (act.dataset.act === "newacct" && isOwner()) accountForm(); if (act.dataset.act === "owef") { S.stFilter = S.tab === "students" && S.stFilter === "owe" ? "active" : "owe"; S.tab = "students"; render(); } }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches(".cls[data-cls], .cls[data-att], .rcard, .tcard")) e.target.click(); });
document.addEventListener("input", e => {
  if (e.target.id === "q") { S.q = e.target.value; S._focusQ = true; render(); }
  if (e.target.id === "docq") { S.docQ = e.target.value; render(); const i = $("#docq"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  if (e.target.id === "lq") { S.lq = e.target.value; render(); const i = $("#lq"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  if (e.target.id === "rq") { S.rq = e.target.value; S.rn = 60; render(); const i = $("#rq"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
});
document.addEventListener("change", e => {
  if (e.target.id === "stf") { S.stFilter = e.target.value; render(); }
  if (e.target.id === "dock") { S.docK = e.target.value; render(); }
  if (e.target.id === "docarc") { S.docArc = e.target.checked; render(); }
  if (e.target.id === "locpick") { S.loc = e.target.value; try { localStorage.setItem("sy-loc", S.loc); } catch { } render(); }
  if (e.target.id === "tchf") { S.tchF = e.target.value; render(); }
  if (e.target.id === "zoomt") { S.zoomT = e.target.value; render(); }
  if (e.target.id === "tatf") { S.tatF = e.target.value; S.attN = 0; render(); }
  if (e.target.id === "kf") { S.kF = e.target.value; render(); }
  if (e.target.id === "kt") { S.kT = e.target.value; render(); }
  if (e.target.id === "kl") { S.kL = e.target.value; render(); }
  if (e.target.id === "kbrief") { S.kBrief = e.target.checked; try { localStorage.setItem("sy-kbrief", S.kBrief ? "1" : ""); } catch { } render(); }
  if (e.target.id === "lvf") { S.lvF = e.target.value; render(); }
  if (e.target.id === "hskf") { S.hskF = e.target.value; render(); }
  if (e.target.id === "hyf") { S.hyF = e.target.value; render(); }
  if (e.target.matches?.("[data-migimp]")) { const f = e.target.files[0]; e.target.value = ""; migImport(f, e.target.closest("label")); }
  if (e.target.id === "rf" || e.target.id === "rs") { S[e.target.id] = e.target.value; S.rn = 60; render(); }
});

function openFromHash() {
  if (S._hashDone || !S.acct || !Object.values(S.ready).every(Boolean)) return;
  S._hashDone = true;
  const id = decodeURIComponent((location.hash || "").slice(1));
  if (id && stu(id)) { S.tab = "students"; render(); openStudent(id); }
}

/* ---------- boot ---------- */
try { const t = localStorage.getItem("sy-tab"); if (t) S.tab = t; const l = localStorage.getItem("sy-lang"); if (l === "es" || l === "zh") S.lang = l; S.loc = localStorage.getItem("sy-loc") || ""; S.kBrief = !!localStorage.getItem("sy-kbrief"); S.stKind = localStorage.getItem("sy-stkind") || "local"; } catch { }
render();
(async () => {
  const [db, assets, downloads, user] = await Promise.all(["db", "assets", "downloads", "user"].map(n => window.claude?.use ? claude.use(n).catch(() => null) : Promise.resolve(null)));
  S.db = db; S.assets = assets; S.downloads = downloads; S.booted = true;
  S.user = user;
  if (window.claude?.use) claude.use("sample").then(async sm => { if (!sm) return; const lim = await sm.limits().catch(() => null); if (!lim?.images) return; S.sample = sm; S.sampleImg = lim.images; if (S.acct && S.tab === "students") render(); }).catch(() => { });
  if (user) { try { const w = await user.can("data.write"); if (w === false) S.readOnly = true; S.uid = await user.id(); } catch { } }
  if (!db) { render(); return; }
  if (FB) {
    // nothing is readable before signing in: show the sign-in (or first-owner) form until Firebase has a user
    await FB.ready;
    try { const m = sessionStorage.getItem("sy-msg"); if (m) { sessionStorage.removeItem("sy-msg"); toast(m); } } catch { }
    if (!FB.user || !FB.uname()) { if (FB.user) await FB.logout(); await FB.checkSetup(); S.ready.a = true; render(); return; }
  }
  const since = S.since = addDays(today(), -200);
  const tBoot = FB && FB.claims?.role === "teacher";
  const sub = (q, key, field) => q.onSnapshot(snap => { _cl = null; S[field] = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (field === "locations" && S.loc && !S.locations.some(x => x.id === S.loc)) S.loc = ""; S.ready[key] = true; render(); openFromHash(); }, () => { S.ready[key] = true; toast(L("数据连接中断，请刷新页面")); render(); });
  // a teacher account reads only its own account, the timetable, students, the teacher list, Zoom, and its own attendance and grades
  (tBoot ? db.collection("accounts").doc(FB.uname()) : db.collection("accounts").limit(200)).onSnapshot(snap => { S.accounts = tBoot ? (snap.exists ? [{ id: snap.id, ...snap.data() }] : []) : snap.docs.map(d => ({ id: d.id, ...d.data() })); S.acctFail = false; S.ready.a = true; syncAcct(); render(); openFromHash(); },
    () => { S.ready.a = true; if (S.acct) toast(L("数据连接中断，请刷新页面")); else S.acctFail = true; render(); });
  // on a slow connection Firestore first answers from what it already has in memory (often only the latest records); that is marked as partial until the server has answered every part
  const subMany = (qs, key, field) => { const parts = qs.map(() => null), cached = qs.map(() => true); S.partial = S.partial || {}; return qs.map((q, i) => q.onSnapshot({ includeMetadataChanges: true }, snap => { parts[i] = snap.docs.map(d => ({ id: d.id, ...d.data() })); cached[i] = snap.metadata.fromCache; if (parts.every(Boolean)) { S[field] = parts.flat(); S.partial[field] = cached.some(Boolean); S.ready[key] = true; render(); openFromHash(); } }, () => { S.ready[key] = true; toast(L("数据连接中断，请刷新页面")); render(); })); };
  sub(db.collection("students").limit(1000), "s", "students");
  sub(db.collection("teachers").limit(500), "t", "teachers");
  sub(db.collection("locations").limit(200), "l", "locations");
  sub(db.collection("classes").where("date", ">=", since).orderBy("date", "asc").limit(1000), "c", "classes");
  sub(db.collection("courses").limit(500), "k", "courses");
  sub(db.collection("rooms").limit(300), "r", "rooms");
  sub(db.collection("zoom").limit(500), "z", "zoom");
  // ready.zp only gates the vault-to-zoompw sync, not the page
  db.collection("zoompw").limit(200).onSnapshot(snap => { S.zoompw = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.ready.zp = true; zpwSync(); if (S.tab === "zoom") render(); }, () => { S.ready.zp = true; });
  sub(db.collection("holidays").limit(500), "h", "holidays");
  if (tBoot) {
    const tid = FB.claims.tid || "-";
    sub(db.collection("attendance").where("teacherId", "==", tid).limit(3000), "at", "attendance");
    sub(db.collection("grades").where("teacherId", "==", tid).limit(500), "gr", "grades");
    sub(db.collection("requests").where("teacherId", "==", tid).limit(500), "rq", "requests");
    Object.assign(S.ready, { p: true, x: true, g: true, i: true, o: true, e: true, m: true, f: true });
    return;
  }
  sub(db.collection("attendance").where("date", ">=", addDays(today(), -400)).limit(5000), "at", "attendance");
  sub(db.collection("grades").limit(1000), "gr", "grades");
  sub(db.collection("requests").where("date", ">=", addDays(today(), -200)).limit(1000), "rq", "requests");
  // payments outgrow one 1000-doc query, so read them in half-year windows and merge
  const cuts = []; for (let y = 2025; y <= new Date().getFullYear() + 1; y++) cuts.push(`${y}-01-01`, `${y}-07-01`);
  const pq = db.collection("payments");
  S.paySub = () => subMany([pq.where("date", "<", cuts[0]), ...cuts.map((c, i) => i + 1 < cuts.length ? pq.where("date", ">=", c).where("date", "<", cuts[i + 1]) : pq.where("date", ">=", c))].map(q => q.limit(1000)), "p", "payments");
  payGate();
  subMany(["exam", "hsk"].map(k => db.collection("scores").where("kind", "==", k).limit(1000)), "x", "scores");
  sub(db.collection("groups").limit(1000), "g", "groups");
  sub(db.collection("items").limit(500), "i", "items");
  sub(db.collection("loans").limit(1000), "o", "loans");
  sub(db.collection("docs").limit(1000), "dc", "docs");
  sub(db.collection("leads").limit(1000), "e", "leads");
  sub(db.collection("families").limit(500), "m", "families");
  // while a flyer text box has focus, only the preview is redrawn so typing is not interrupted
  db.collection("flyer").limit(20).onSnapshot(snap => { S.flyer = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.ready.f = true; render(); }, () => { S.ready.f = true; render(); });
})();
